[package]
name = "faceguard"
version = "1.1.0"
description = "FaceGuard — Windows Face Presence Auto-Lock"
authors = ["Hamed <hamedhdd@gmail.com>"]
edition = "2021"

[lib]
name = "faceguard_core"
path = "src/lib.rs"

[[bin]]
name = "faceguard"
path = "src/main.rs"

[dependencies]
tauri = { version = "=2.11.6", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
nokhwa = { version = "0.10.11", features = ["input-native"] }
tract-onnx = "0.21.19"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
crossbeam-channel = "0.5"
parking_lot = "0.12"
winreg = "0.55"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Shutdown",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security"
] }

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
